# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: casvisor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/casvisor/casvisor/agent.Version={{.Version}}
  # opens casvisor:// links of the web console in the clients on the user's machine
  - id: casvisor-launcher
    main: ./launcher
    binary: casvisor-launcher
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - '{{ if eq .Os "windows" }}-H windowsgui{{ end }}'

archives:
  - ids: [casvisor]
    formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: 'web/build'
        dst: './web/build'
      - src: 'conf/app.conf'
        dst: './conf/app.conf'
      - src: 'data'
        dst: './data'
      - src: 'swagger'
        dst: './swagger'
  # a plain executable, which the web console links to as releases/latest/download/casvisor-launcher_<os>_<arch>[.exe]
  - id: casvisor-launcher
    ids: [casvisor-launcher]
    formats: [binary]
    name_template: 'casvisor-launcher_{{ .Os }}_{{ .Arch }}'

changelog:
  sort: asc
  filters:
    # goreleaser matches these against whole `<sha> <subject>` log lines, so the
    # type has to be reached past the sha rather than anchored at "^".
    exclude:
      - '^.*?docs(\([[:word:]]+\))??!?:.+$'
      - '^.*?test(\([[:word:]]+\))??!?:.+$'
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance improvements
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Refactors
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Build & CI
      regexp: '^.*?(build|ci)(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: Others
      order: 999
