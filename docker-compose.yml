services:
  casvisor:
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile
      target: STANDARD
    ports:
      - "19000:19000"
      - "2222:2222"
    environment:
      # the first password of "admin"; when empty, a random one is printed in the log
      adminPassword: ""
    volumes:
      - casvisor-db:/db
volumes:
  casvisor-db:
