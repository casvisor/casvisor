swagger: "2.0"
info: {}
basePath: /api
paths:
  /add-access-request:
    post:
      tags:
      - Access Request API
      description: request access to assets for the signed-in user
      operationId: ApiController.AddAccessRequest
      parameters:
      - in: body
        name: body
        description: The details of the request
        required: true
        schema:
          $ref: '#/definitions/object.AccessRequest'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-asset:
    post:
      tags:
      - Asset API
      description: add a asset
      operationId: ApiController.AddAsset
      parameters:
      - in: body
        name: body
        description: The details of the asset
        required: true
        schema:
          $ref: '#/definitions/object.Asset'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-asset-account:
    post:
      tags:
      - Asset Account API
      description: add a system account to an asset
      operationId: ApiController.AddAssetAccount
      parameters:
      - in: body
        name: body
        description: The details of the account
        required: true
        schema:
          $ref: '#/definitions/object.AssetAccount'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-asset-node:
    post:
      tags:
      - Asset Node API
      description: add an asset node
      operationId: ApiController.AddAssetNode
      parameters:
      - in: body
        name: body
        description: The details of the node
        required: true
        schema:
          $ref: '#/definitions/object.AssetNode'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-asset-tunnel:
    post:
      tags:
      - Session API
      description: add a session to connect to an asset; the username and password typed for an asset that keeps none go in the body, and are used once by the session's tunnel within a minute
      operationId: ApiController.AddAssetTunnel
      parameters:
      - in: query
        name: assetId
        description: The id of asset
        required: true
        type: string
      - in: query
        name: account
        description: The username of the account to connect as, the asset's own account when empty
        type: string
      - in: body
        name: body
        description: The username and password, when the asset keeps none
        schema:
          $ref: '#/definitions/object.TunnelCredential'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/Response'
  /add-client-token:
    post:
      tags:
      - Session API
      description: 'issue a one-time token, valid for two minutes, that lets a client on the user''s machine open one connection to an asset: kind "ssh" signs in to the SSH gateway on an SSH asset (ssh, Xshell, WinSCP), "tunnel" forwards a local port to an asset through the SSH gateway, and "rdp" lets mstsc reach an RDP asset through Casvisor''s Remote Desktop Gateway; "tunnel" and "rdp" pass the traffic through without recording it and need the Forward action'
      operationId: ApiController.AddClientToken
      parameters:
      - in: query
        name: assetId
        description: The id of the asset
        required: true
        type: string
      - in: query
        name: account
        description: The system account of the asset to connect as
        type: string
      - in: query
        name: kind
        description: ssh, tunnel or rdp
        required: true
        type: string
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.ClientToken'
  /add-command-rule:
    post:
      tags:
      - Command Rule API
      description: add a command rule
      operationId: ApiController.AddCommandRule
      parameters:
      - in: body
        name: body
        description: The details of the command rule
        required: true
        schema:
          $ref: '#/definitions/object.CommandRule'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-local-user:
    post:
      tags:
      - Local User API
      description: add a local user
      operationId: ApiController.AddLocalUser
      parameters:
      - in: body
        name: body
        description: The details of the local user
        required: true
        schema:
          $ref: '#/definitions/object.LocalUser'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-login-rule:
    post:
      tags:
      - Login Rule API
      description: add a login rule
      operationId: ApiController.AddLoginRule
      parameters:
      - in: body
        name: body
        description: The details of the login rule
        required: true
        schema:
          $ref: '#/definitions/object.LoginRule'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-network-gateway:
    post:
      tags:
      - Network Gateway API
      description: add a network gateway
      operationId: ApiController.AddNetworkGateway
      parameters:
      - in: body
        name: body
        description: The details of the network gateway
        required: true
        schema:
          $ref: '#/definitions/object.NetworkGateway'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-permission:
    post:
      tags:
      - Permission API
      description: add a permission
      operationId: ApiController.AddPermission
      parameters:
      - in: body
        name: body
        description: The details of the permission
        required: true
        schema:
          $ref: '#/definitions/object.Permission'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-record:
    post:
      tags:
      - Record API
      description: add a record
      operationId: ApiController.AddRecord
      parameters:
      - in: body
        name: body
        description: The details of the record
        required: true
        schema:
          $ref: '#/definitions/object.Record'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-session:
    post:
      tags:
      - Session API
      description: add session
      operationId: ApiController.AddSession
      parameters:
      - in: body
        name: body
        description: The session object
        required: true
        schema:
          $ref: '#/definitions/object.Session'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/Response'
  /add-ssh-key:
    post:
      tags:
      - SSH Key API
      description: add an SSH public key for the signed-in user to sign in to the SSH gateway with
      operationId: ApiController.AddSshKey
      parameters:
      - in: body
        name: body
        description: The SSH key object
        required: true
        schema:
          $ref: '#/definitions/object.SshKey'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-webhook:
    post:
      tags:
      - Webhook API
      description: add a webhook
      operationId: ApiController.AddWebhook
      parameters:
      - in: body
        name: body
        description: The details of the webhook
        required: true
        schema:
          $ref: '#/definitions/object.Webhook'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /approve-access-request:
    post:
      tags:
      - Access Request API
      description: approve a pending access request, which adds a permission for it
      operationId: ApiController.ApproveAccessRequest
      parameters:
      - in: query
        name: id
        description: The id ( owner/name ) of the access request
        required: true
        type: string
      - in: body
        name: body
        description: The comment, and the actions and end time when they are narrowed
        schema:
          $ref: '#/definitions/controllers.AccessReviewForm'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/object.Permission'
  /cancel-access-request:
    post:
      tags:
      - Access Request API
      description: cancel a pending access request of the signed-in user
      operationId: ApiController.CancelAccessRequest
      parameters:
      - in: query
        name: id
        description: The id ( owner/name ) of the access request
        required: true
        type: string
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /cancel-job:
    post:
      tags:
      - Job API
      description: stop a running job
      operationId: ApiController.CancelJob
      parameters:
      - in: query
        name: id
        description: The id ( owner/name ) of the job
        required: true
        type: string
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /cancel-login-review:
    post:
      tags:
      - Login Rule API
      description: stop waiting for the review of this browser's sign-in
      operationId: ApiController.CancelLoginReview
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /change-password:
    post:
      tags:
      - Account API
      description: change the password of the signed-in local user
      operationId: ApiController.ChangePassword
      parameters:
      - in: body
        name: body
        description: The old and the new password
        required: true
        schema:
          $ref: '#/definitions/controllers.PasswordForm'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /connect-agent:
    get:
      tags:
      - Network Gateway API
      description: the WebSocket endpoint that network gateway agents connect to, carrying an SSH connection signed in with the agent token
      operationId: ApiController.ConnectAgent
      responses:
        "101":
          description: '{string} Switching Protocols'
  /create-session-dir:
    post:
      tags:
      - Session File API
      description: create a directory on the asset of an SSH session or the drive of an RDP session
      operationId: ApiController.CreateSessionDir
      parameters:
      - in: query
        name: id
        description: The id of the session
        required: true
        type: string
      - in: query
        name: path
        description: The absolute path of the new directory
        required: true
        type: string
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-access-request:
    post:
      tags:
      - Access Request API
      description: delete an access request, leaving the permission of an approved one in place
      operationId: ApiController.DeleteAccessRequest
      parameters:
      - in: body
        name: body
        description: The access request
        required: true
        schema:
          $ref: '#/definitions/object.AccessRequest'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-asset:
    post:
      tags:
      - Asset API
      description: delete a asset
      operationId: ApiController.DeleteAsset
      parameters:
      - in: body
        name: body
        description: The details of the asset
        required: true
        schema:
          $ref: '#/definitions/object.Asset'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-asset-account:
    post:
      tags:
      - Asset Account API
      description: delete a system account of an asset
      operationId: ApiController.DeleteAssetAccount
      parameters:
      - in: body
        name: body
        description: The details of the account
        required: true
        schema:
          $ref: '#/definitions/object.AssetAccount'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-asset-node:
    post:
      tags:
      - Asset Node API
      description: delete an asset node that has no child nodes, no assets and no permissions
      operationId: ApiController.DeleteAssetNode
      parameters:
      - in: body
        name: body
        description: The node
        required: true
        schema:
          $ref: '#/definitions/object.AssetNode'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-command-rule:
    post:
      tags:
      - Command Rule API
      description: delete a command rule
      operationId: ApiController.DeleteCommandRule
      parameters:
      - in: body
        name: body
        description: The details of the command rule
        required: true
        schema:
          $ref: '#/definitions/object.CommandRule'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-job:
    post:
      tags:
      - Job API
      description: delete a job that is not running, with its results and its uploaded file
      operationId: ApiController.DeleteJob
      parameters:
      - in: body
        name: body
        description: The owner and name of the job
        required: true
        schema:
          $ref: '#/definitions/object.Job'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-local-user:
    post:
      tags:
      - Local User API
      description: delete a local user
      operationId: ApiController.DeleteLocalUser
      parameters:
      - in: body
        name: body
        description: The details of the local user
        required: true
        schema:
          $ref: '#/definitions/object.LocalUser'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-login-rule:
    post:
      tags:
      - Login Rule API
      description: delete a login rule
      operationId: ApiController.DeleteLoginRule
      parameters:
      - in: body
        name: body
        description: The login rule
        required: true
        schema:
          $ref: '#/definitions/object.LoginRule'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-network-gateway:
    post:
      tags:
      - Network Gateway API
      description: delete a network gateway
      operationId: ApiController.DeleteNetworkGateway
      parameters:
      - in: body
        name: body
        description: The details of the network gateway
        required: true
        schema:
          $ref: '#/definitions/object.NetworkGateway'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-permission:
    post:
      tags:
      - Permission API
      description: delete a permission
      operationId: ApiController.DeletePermission
      parameters:
      - in: body
        name: body
        description: The details of the permission
        required: true
        schema:
          $ref: '#/definitions/object.Permission'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-session:
    post:
      tags:
      - Session API
      description: delete session
      operationId: ApiController.DeleteSession
      parameters:
      - in: query
        name: id
        description: The id of session
        required: true
        type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/Response'
  /delete-session-file:
    post:
      tags:
      - Session File API
      description: delete a file, or a directory with everything in it, on the asset of an SSH session or the drive of an RDP session
      operationId: ApiController.DeleteSessionFile
      parameters:
      - in: query
        name: id
        description: The id of the session
        required: true
        type: string
      - in: query
        name: path
        description: The absolute path of the file or directory
        required: true
        type: string
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-ssh-key:
    post:
      tags:
      - SSH Key API
      description: delete an SSH public key of the signed-in user
      operationId: ApiController.DeleteSshKey
      parameters:
      - in: body
        name: body
        description: The SSH key object
        required: true
        schema:
          $ref: '#/definitions/object.SshKey'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-webhook:
    post:
      tags:
      - Webhook API
      description: delete a webhook
      operationId: ApiController.DeleteWebhook
      parameters:
      - in: body
        name: body
        description: The webhook
        required: true
        schema:
          $ref: '#/definitions/object.Webhook'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /disable-mfa:
    post:
      tags:
      - Account API
      description: turn off two-factor sign-in of the signed-in user, who confirms it with the password
      operationId: ApiController.DisableMfa
      parameters:
      - in: body
        name: body
        description: The password
        required: true
        schema:
          $ref: '#/definitions/controllers.MfaForm'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /download-session-file:
    get:
      tags:
      - Session File API
      description: download a file from the asset of an SSH session or the drive of an RDP session
      operationId: ApiController.DownloadSessionFile
      parameters:
      - in: query
        name: id
        description: The id of the session
        required: true
        type: string
      - in: query
        name: path
        description: The absolute path of the file
        required: true
        type: string
      responses:
        "200":
          description: '{file} file The file'
  /enable-mfa:
    post:
      tags:
      - Account API
      description: turn on two-factor sign-in with a code from the secret of get-mfa-setup
      operationId: ApiController.EnableMfa
      parameters:
      - in: body
        name: body
        description: The code from the authenticator app
        required: true
        schema:
          $ref: '#/definitions/controllers.MfaForm'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /export-assets:
    get:
      tags:
      - Asset API
      description: download the assets that match the filter of the asset list as CSV, without passwords and private keys, in the format of the import
      operationId: ApiController.ExportAssets
      parameters:
      - in: query
        name: owner
        description: The owner of the assets
        required: true
        type: string
      - in: query
        name: node
        description: Only the assets in this node or below it, @none for the assets in no node
        type: string
      - in: query
        name: field
        description: The field to filter on
        type: string
      - in: query
        name: value
        description: The value of the filter
        type: string
      responses:
        "200":
          description: '{string} string The CSV file'
  /export-commands:
    get:
      tags:
      - Command API
      description: download the commands that match the filter of the command list as CSV, 100,000 at most
      operationId: ApiController.ExportCommands
      parameters:
      - in: query
        name: owner
        description: The owner of the commands
        required: true
        type: string
      - in: query
        name: field
        description: The field to filter on
        type: string
      - in: query
        name: value
        description: The value of the filter
        type: string
      responses:
        "200":
          description: '{string} string The CSV file'
  /export-database-result:
    get:
      tags:
      - Session API
      description: download a result of a connected database session as CSV, with the Download permission
      operationId: ApiController.ExportDatabaseResult
      parameters:
      - in: query
        name: id
        description: The id of the session
        required: true
        type: string
      - in: query
        name: result
        description: The id of the result
        required: true
        type: string
      responses:
        "200":
          description: '{file} file The CSV file'
  /export-records:
    get:
      tags:
      - Record API
      description: download the records that match the filter of the record list as CSV, 100,000 at most
      operationId: ApiController.ExportRecords
      parameters:
      - in: query
        name: owner
        description: The owner of the records
        required: true
        type: string
      - in: query
        name: field
        description: The field to filter on
        type: string
      - in: query
        name: value
        description: The value of the filter
        type: string
      responses:
        "200":
          description: '{string} string The CSV file'
  /export-sessions:
    get:
      tags:
      - Session API
      description: download the sessions that match the filter of the session list as CSV, 100,000 at most
      operationId: ApiController.ExportSessions
      parameters:
      - in: query
        name: owner
        description: The owner of the sessions
        required: true
        type: string
      - in: query
        name: status
        description: connected or disconnected
        type: string
      - in: query
        name: field
        description: The field to filter on
        type: string
      - in: query
        name: value
        description: The value of the filter
        type: string
      responses:
        "200":
          description: '{string} string The CSV file'
  /generate-network-gateway-token:
    post:
      tags:
      - Network Gateway API
      description: generate a new token for the agent of an agent network gateway, the agent with the old token is disconnected. The token is only returned this once
      operationId: ApiController.GenerateNetworkGatewayToken
      parameters:
      - in: query
        name: id
        description: The id ( owner/name ) of the network gateway
        required: true
        type: string
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /get-access-requests:
    get:
      tags:
      - Access Request API
      description: get the access requests of the organization, or only the signed-in user's own requests for a user who is not an administrator
      operationId: ApiController.GetAccessRequests
      parameters:
      - in: query
        name: owner
        description: The owner of access requests
        required: true
        type: string
      - in: query
        name: pageSize
        description: The size of each page
        type: string
      - in: query
        name: p
        description: The number of the page
        type: string
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/object.AccessRequest'
  /get-asset:
    get:
      tags:
      - Asset API
      description: get asset
      operationId: ApiController.GetAsset
      parameters:
      - in: query
        name: id
        description: The id ( owner/name ) of the asset
        required: true
        type: string
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/object.Asset'
  /get-asset-account:
    get:
      tags:
      - Asset Account API
      description: get a system account of an asset
      operationId: ApiController.GetAssetAccount
      parameters:
      - in: query
        name: id
        description: The id ( owner/name ) of the account
        required: true
        type: string
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/object.AssetAccount'
  /get-asset-accounts:
    get:
      tags:
      - Asset Account API
      description: get the system accounts of an asset, besides the asset's own account
      operationId: ApiController.GetAssetAccounts
      parameters:
      - in: query
        name: asset
        description: The id ( owner/name ) of the asset
        required: true
        type: string
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/object.AssetAccount'
  /get-asset-database:
    get:
      tags:
      - Session API
      description: connect to the database of an asset (MySQL, PostgreSQL, SQL Server, Oracle, Redis or MongoDB) over a websocket, to browse it and run SQL, Redis commands or MongoDB shell calls; every statement is checked against the command rules and recorded as a command of the session
      operationId: ApiController.GetAssetDatabase
      parameters:
      - in: query
        name: sessionId
        description: The id of the session, from add-asset-tunnel
        required: true
        type: string
  /get-asset-kubernetes:
    get:
      tags:
      - Session API
      description: open a shell in a container of a Kubernetes asset over a websocket, with the same messages as get-asset-ssh; commands are checked against the command rules and recorded, and the terminal is recorded
      operationId: ApiController.GetAssetKubernetes
      parameters:
      - in: query
        name: sessionId
        description: The id of the session, from add-asset-tunnel
        required: true
        type: string
      - in: query
        name: cols
        description: The columns of the terminal
        required: true
        type: integer
        format: int64
      - in: query
        name: rows
        description: The rows of the terminal
        required: true
        type: integer
        format: int64
      - in: query
        name: namespace
        description: The namespace of the pod
        required: true
