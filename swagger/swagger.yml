swagger: "2.0"
info: {}
basePath: /api
paths:
  /add-asset:
    post:
      tags:
      - Asset API
      description: add a asset
      operationId: ApiController.AddAsset
      parameters:
      - in: body
        name: body
        description: The details of the asset
        required: true
        schema:
          $ref: '#/definitions/object.Asset'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-asset-tunnel:
    get:
      tags:
      - Session API
      description: add session
      operationId: ApiController.AddAssetTunnel
      parameters:
      - in: query
        name: assetId
        description: The id of asset
        required: true
        type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/Response'
  /add-command-rule:
    post:
      tags:
      - Command Rule API
      description: add a command rule
      operationId: ApiController.AddCommandRule
      parameters:
      - in: body
        name: body
        description: The details of the command rule
        required: true
        schema:
          $ref: '#/definitions/object.CommandRule'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-local-user:
    post:
      tags:
      - Local User API
      description: add a local user
      operationId: ApiController.AddLocalUser
      parameters:
      - in: body
        name: body
        description: The details of the local user
        required: true
        schema:
          $ref: '#/definitions/object.LocalUser'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-permission:
    post:
      tags:
      - Permission API
      description: add a permission
      operationId: ApiController.AddPermission
      parameters:
      - in: body
        name: body
        description: The details of the permission
        required: true
        schema:
          $ref: '#/definitions/object.Permission'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-record:
    post:
      tags:
      - Record API
      description: add a record
      operationId: ApiController.AddRecord
      parameters:
      - in: body
        name: body
        description: The details of the record
        required: true
        schema:
          $ref: '#/definitions/object.Record'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /add-session:
    post:
      tags:
      - Session API
      description: add session
      operationId: ApiController.AddSession
      parameters:
      - in: body
        name: body
        description: The session object
        required: true
        schema:
          $ref: '#/definitions/object.Session'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/Response'
  /add-ssh-key:
    post:
      tags:
      - SSH Key API
      description: add an SSH public key for the signed-in user to sign in to the SSH gateway with
      operationId: ApiController.AddSshKey
      parameters:
      - in: body
        name: body
        description: The SSH key object
        required: true
        schema:
          $ref: '#/definitions/object.SshKey'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /change-password:
    post:
      tags:
      - Account API
      description: change the password of the signed-in local user
      operationId: ApiController.ChangePassword
      parameters:
      - in: body
        name: body
        description: The old and the new password
        required: true
        schema:
          $ref: '#/definitions/controllers.PasswordForm'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /create-session-dir:
    post:
      tags:
      - Session File API
      description: create a directory on the asset of an SSH session
      operationId: ApiController.CreateSessionDir
      parameters:
      - in: query
        name: id
        description: The id of the session
        required: true
        type: string
      - in: query
        name: path
        description: The absolute path of the new directory
        required: true
        type: string
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-asset:
    post:
      tags:
      - Asset API
      description: delete a asset
      operationId: ApiController.DeleteAsset
      parameters:
      - in: body
        name: body
        description: The details of the asset
        required: true
        schema:
          $ref: '#/definitions/object.Asset'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-command-rule:
    post:
      tags:
      - Command Rule API
      description: delete a command rule
      operationId: ApiController.DeleteCommandRule
      parameters:
      - in: body
        name: body
        description: The details of the command rule
        required: true
        schema:
          $ref: '#/definitions/object.CommandRule'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-local-user:
    post:
      tags:
      - Local User API
      description: delete a local user
      operationId: ApiController.DeleteLocalUser
      parameters:
      - in: body
        name: body
        description: The details of the local user
        required: true
        schema:
          $ref: '#/definitions/object.LocalUser'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-permission:
    post:
      tags:
      - Permission API
      description: delete a permission
      operationId: ApiController.DeletePermission
      parameters:
      - in: body
        name: body
        description: The details of the permission
        required: true
        schema:
          $ref: '#/definitions/object.Permission'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-record:
    post:
      tags:
      - Record API
      description: delete a record
      operationId: ApiController.DeleteRecord
      parameters:
      - in: body
        name: body
        description: The details of the record
        required: true
        schema:
          $ref: '#/definitions/object.Record'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-session:
    post:
      tags:
      - Session API
      description: delete session
      operationId: ApiController.DeleteSession
      parameters:
      - in: query
        name: id
        description: The id of session
        required: true
        type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/Response'
  /delete-session-file:
    post:
      tags:
      - Session File API
      description: delete a file, or a directory with everything in it, on the asset of an SSH session
      operationId: ApiController.DeleteSessionFile
      parameters:
      - in: query
        name: id
        description: The id of the session
        required: true
        type: string
      - in: query
        name: path
        description: The absolute path of the file or directory
        required: true
        type: string
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /delete-ssh-key:
    post:
      tags:
      - SSH Key API
      description: delete an SSH public key of the signed-in user
      operationId: ApiController.DeleteSshKey
      parameters:
      - in: body
        name: body
        description: The SSH key object
        required: true
        schema:
          $ref: '#/definitions/object.SshKey'
      responses:
        "200":
          description: The Response object
          schema:
            $ref: '#/definitions/controllers.Response'
  /download-session-file:
    get:
