      - Session File API
      description: download a file from the asset of an SSH session
      operationId: ApiController.DownloadSessionFile
      parameters:
      - in: query
        name: id
        description: The id of the session
        required: true
        type: string
      - in: query
        name: path
        description: The absolute path of the file
        required: true
        type: string
      responses:
        "200":
          description: '{file} file The file'
  /get-asset:
    get:
